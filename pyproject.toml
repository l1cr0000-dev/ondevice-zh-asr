[project]
name = "ondevice-zh-asr"
version = "0.1.0"
description = "Apple 設備上的離線、低延遲端側中文串流語音辨識全鏈路"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jiwer>=4.0.0",
    "kaldi-native-fbank>=1.22.5",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "opencc>=1.4.2",
    "psutil>=7.2.2",
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "eval", "scripts", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
